name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-types-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace (all members + all dependency groups)
        run: uv sync --all-packages --all-groups

      - name: Ruff (lint + format check)
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .

      - name: Mypy (strict)
        run: uv run --no-sync mypy

      - name: Pytest (with coverage gate)
        run: uv run --no-sync pytest --cov --cov-report=term-missing

      - name: Cockpit config snapshot is fresh
        run: |
          uv run --no-sync python scripts/snapshot_cockpit_config.py
          git diff --exit-code pod/apps/cockpit/source/src/generated/config.json
