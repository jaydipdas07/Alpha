[project]
name = "worker"
version = "0.0.0"
description = "Alpha worker — the sole live executor; imports alpha-core (TEST-8)."
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Jaydip Das" }]
dependencies = [
    "alpha-core",
    # The crypto execution venue SDK (Binance/Delta) — the worker is the sole
    # executor, so ccxt lives here, never in alpha-core (no broker SDK in the kernel).
    "ccxt>=4.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

# alpha-core resolves to the in-repo workspace member (the parity guarantee: the
# worker runs the same kernel code the backtester does).
[tool.uv.sources]
alpha-core = { workspace = true }
