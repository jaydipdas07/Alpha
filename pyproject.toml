# Alpha — uv workspace root (coordinator only; the installable packages are the
# members below). Tooling config is centralised here so a tunable lives in ONE
# place (CLAUDE.md: single source of truth). `pod/` is a Lemma pod bundle deployed
# via the `lemma` CLI — not a pip package — so it is intentionally not a member.
[project]
name = "alpha"
version = "0.0.0"
description = "Alpha — AI-driven multi-asset algorithmic auto-trading platform (workspace root)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Jaydip Das" }]

[tool.uv]
package = false  # the root coordinates the workspace; it is not itself a package.

[tool.uv.workspace]
members = ["alpha-core", "worker"]

# Dev tooling shared by the whole workspace, pinned to the same versions Vega's
# CI proves (B0.2 mirrors the rest of Vega's gates). Lives at the root so ruff /
# mypy / pytest run identically over every member.
[dependency-groups]
dev = [
    "ruff>=0.15.17",
    "mypy>=2.1.0",
    "pytest>=9.1.0",
    "hypothesis>=6.155.3",
    "pre-commit>=4.6.0",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.4.0",
    "types-PyYAML>=6.0.12",
    # Research-plane data store (alpha_core.data.store). Runtime deps of the cold
    # store, but kept in the dev group (not alpha-core core deps) so the live worker's
    # prod install stays lean + duckdb-free; CI/research/dev get them via --all-groups.
    "duckdb>=1.5.4",
    "pyarrow>=17.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["alpha-core/src", "alpha-core/tests", "worker/src", "worker/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["alpha_core", "worker"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["alpha-core/src", "alpha-core/tests", "worker/src", "worker/tests"]
mypy_path = ["alpha-core/src", "worker/src"]
namespace_packages = true
explicit_package_bases = true

# alembic is imported lazily inside execution/state.py::run_migrations (the prod
# schema path) and isn't a kernel runtime dep — the migration framework + alembic.ini
# land with the migrations/ dir in a later increment. Until then it has no stubs here.
[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

# The cold-store deps (alpha_core.data.store) ship partial/untyped APIs (pyarrow's
# parquet writers, duckdb's connection); treat them as untyped so --strict doesn't
# flag every call. The store's own types (Bar in/out) stay fully checked.
[[tool.mypy.overrides]]
module = ["pyarrow.*", "duckdb.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["alpha-core/tests", "worker/tests"]
addopts = "-q"
# The OMS + adapters are async (ccxt.pro / asyncio event loop); auto mode runs
# bare `async def test_*` without a per-test marker (mirrors Vega's pytest config).
asyncio_mode = "auto"

[tool.coverage.run]
# Measure the two installed packages (the kernel + the worker). Paths match the
# editable-install source so imported modules map back correctly.
source = ["alpha-core/src/alpha_core", "worker/src/worker"]
branch = true
# Lifted-ahead-of-their-phase modules: imported now (oms needs the InstrumentRegistry
# type; test_oms needs handle_kill) but whose phase-specific paths are exercised by a
# layer not yet lifted. Their in-scope entry points are still tested (test_instruments,
# test_oms) — these omits only stop the unbuilt paths from dragging the floor. Each
# rejoins measurement (drop its line) when its layer's tests land in B0.9 / the phases.
omit = [
    # option / F&O / ccxt registry methods belong to the options + crypto-adapter
    # test layers (Phase 5+); from_config + basic lookup (what the OMS uses) is tested.
    "alpha-core/src/alpha_core/execution/instruments.py",
    # NB: execution/session.py is deliberately NOT omitted — handle_kill (the OMS
    # kill path, TEST-4) is in scope and covered by test_oms, so it must count toward
    # the floor. Only its unbuilt square_off + quote/price helpers carry a per-function
    # `# pragma: no cover` (with a reason) until the scheduler/Phase-3 tests land.
    # (helpers/decimal_utils.py rejoined coverage in B0.9f — test_helpers, lifted with
    # the ccxt adapter's ratelimit/retry helpers, now exercises floor_to_lot/quantize_to_tick.)
    # (data/feed.py rejoined coverage in B1a.1 — test_feed, lifted with the data
    # readers, now exercises ReplayFeed + AdapterFeed.)
    # the portfolio risk overlay is a P3/scaling feature: the lifted backtest tests run
    # the allocator with overlay=None, and its dedicated test (test_portfolio_risk_overlay)
    # needs the universe-config layer (data.universe -> SelectionToken/UniverseConfig),
    # deferred. Rejoins measurement when the universe config + that test land.
    "alpha-core/src/alpha_core/portfolio/risk_overlay.py",
]

[tool.coverage.report]
# Floor for the whole workspace (mirrors Vega's 94, B0.2). The money path (risk /
# OMS / reconcile) will sit higher and be property- + live-validated; pure-IO glue
# is `# pragma: no cover` with a reason. A drop below this fails CI.
fail_under = 94
show_missing = true
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]
