# NGE-family last-half-hour momentum (survey §5, Baltussen form) — deployment defaults.
# The DISCOVERY space lives in research/nge_templates.py (the pre-registration); this
# file configures a deployed/paper instance (strategy/registry.py builder) — which is
# the UNCONDITIONED form only: a conditioned deployment needs a live NGE feed (none
# exists yet; the constructor enforces the map for conditioning=1).
# ⚠ MIS-REQUIRED: deploy only with intraday_square_off=true (gap days belong to the
# engine's flatteners; the strategy resets silently — see the module docstring).
strategy_id: nifty_lhh_momentum
conditioning: 0          # 0 = none (deployable); 1 = short-gamma days only (research)
signal_time: "14:35"     # IST close instant the day-so-far sign is read
flat_time: "15:05"       # IST EOD-flat instant (before the 15:10 no-new-entry gate)
quantity: "20"           # fixed units (string -> Decimal, B5)
