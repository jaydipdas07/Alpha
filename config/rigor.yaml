# config/rigor.yaml — statistical-rigor tunables (B1a.4+).
# CLAUDE.md: no magic numbers in code — tweaking a rigor metric means editing
# one value here, validated by RigorConfig (alpha_core.helpers.config).

# Combinatorial Purged Cross-Validation (CPCV) — López de Prado, AFML ch. 12.
# The in-sample series is split into `n_groups` contiguous groups; every choice of
# `n_test_groups` groups is one test fold (C(n_groups, n_test_groups) backtest
# paths), with observations within `embargo_frac` of a test block purged from the
# training set so a label adjacent to the test cannot leak across the boundary.
cpcv:
  n_groups: 6          # N
  n_test_groups: 2     # k  ->  C(6,2) = 15 paths
  embargo_frac: 0.01   # fraction of observations purged/embargoed around each test block

# Probability of Backtest Overfitting (PBO) via CSCV — Bailey, Borwein,
# López de Prado & Zhu (2017), "The Probability of Backtest Overfitting".
# The (time x trial) performance matrix is split into `n_splits` row-subsets; over
# all C(n_splits, n_splits/2) in-sample/out-of-sample partitions, PBO is the
# fraction in which the in-sample-best trial lands below the out-of-sample median.
pbo:
  n_splits: 10         # S (must be even)  ->  C(10,5) = 252 partitions
  threshold: 0.5       # PBO above this flags selection overfitting (reject)

# Deflated Sharpe Ratio (DSR) — Bailey & López de Prado (2014). A candidate's observed
# Sharpe is deflated by the Sharpe expected as the best of `cumulative_trials` (the
# per-cell count from the keyed trial ledger, R4); DSR is the probability the edge is
# real after that deflation. A candidate must clear `threshold` to be significant.
dsr:
  threshold: 0.92      # minimum DSR (probability) for a significant edge after deflation —
                       # loosened from 0.95 (B1a.9 calibration) so a realistic strong edge clears
                       # the false-reject bound. Picked at the HIGH (safe) end of the feasible
                       # [0.90, 0.92] window: false-promote (the dangerous error) stays 0 here,
                       # while 0.90 lets the worst noise candidate (DSR 0.909) slip through.

# Roll-forward locked holdout (R5) in the no-ACL store (R6, TEST-3). The most recent
# `fraction` of the data span is locked into a physically separate store the research
# surface (strategist / RAG / table-read agents) is never handed; it rolls forward as
# new data arrives, so the loop can never reach the present. Used once, as the final gate.
holdout:
  fraction: 0.2        # last 20% of the time span is the locked holdout

# vectorbt coarse pre-screen (R7) — a fast, float, vectorized walk-forward run UPSTREAM of
# CPCV to cull obvious losers cheaply, so the expensive CPCV/PBO only runs on survivors. A
# candidate passes iff its median per-bar Sharpe over `n_windows` out-of-sample windows
# clears `min_sharpe`. Coarse by design (no full cost model / Decimal) — CPCV is the real gate.
prescreen:
  min_sharpe: 0.0      # cull a candidate whose median coarse OOS per-bar Sharpe is below this
  n_windows: 3         # coarse out-of-sample walk-forward windows

# CPCV compute budget + carry-forward (R7) — run a night's CPCV queue (the pre-screen
# survivors) within a wall-clock budget across a parallel pool; the unfinished rest is
# CARRIED to the next run, never truncated.
cpcv_budget:
  budget_seconds: 28800   # 8h — a night's compute budget
  pool_size: 4            # parallel CPCV workers (processes in production)

# Population-calibration error-rate gate (R14) — the [You]-ratified Tier-2 thresholds the rigor
# gate must meet against control populations before the strategist is trusted (the Phase-1b gate).
# The dangerous error is promoting noise/overfit, so its bound is strict; rejecting a real edge
# is the cheaper error, so its bound is looser.
calibration:
  false_promote_max: 0.05   # max rate of promoting a noise/overfit control
  false_reject_max: 0.25    # max rate of rejecting a genuine planted edge
  n_candidates: 40          # candidates per synthetic population
  n_obs: 2400               # return-series length — a realistic ~5y daily OOS evaluation horizon
  edge_drift: 0.15          # the planted edge's per-bar mean (annualized Sharpe ~2.4 — realistic)
  oos_fraction: 0.5         # the out-of-sample slice the gate judges on (50/50 IS/OOS split)

# Quant-analyst verdict (B1b.2) — composes the DSR significance gate with a coarse OOS-edge
# screen, a fold-consistency (regime) check, and an optional cell-level PBO into a
# promote / reject / revise call. The DSR (dsr.threshold, B1a.9-calibrated) does the promote-work.
quant_analyst:
  min_oos_sharpe: 0.0        # coarse out-of-sample edge screen: OOS Sharpe <= this => no edge =>
                             # REJECT (also how a high-IS/poor-OOS overfit dies). Its OWN threshold,
                             # NOT the B1a.8 vectorbt pre-screen (which is a windowed walk-forward).
  fold_consistency_min: 0.6  # min fraction of the combinatorial test folds with positive Sharpe to
                             # promote; below it a significant edge is "fragile" -> REVISE. A
                             # judgment call, NOT a B1a.9-calibrated threshold like dsr.threshold.
  oos_fraction: 0.5          # out-of-sample slice the verdict judges (matches calibration.oos_fraction)



# One-shot holdout gate evaluation (the M3.0-follow-on power fix). The holdout window is
# 100% out-of-sample BY CONSTRUCTION — the candidate is frozen (params + deflation inputs
# locked from the in-sample sweep) before the gate reads a single holdout bar — so the gate
# judges the WHOLE window: oos_fraction 1.0. The old behavior (falling back to
# quant_analyst.oos_fraction = 0.5) silently discarded half the already-tiny holdout, a
# sqrt(2) power loss at zero safety benefit. Calibration at holdout-shaped inputs (n_obs
# 224) shows false-promote stays 0 while false-reject strictly improves
# (test_calibration.py::test_holdout_shaped_*).
holdout_eval:
  oos_fraction: 1.0    # judge the full holdout window (it is all OOS to a frozen candidate)

# M3.7 paper-run acceptance — does forward paper-trading confirm the backtest? A paper
# run passes (-> Workflow B) only if the live paper edge persists AND keeps enough of the
# backtest Sharpe (so slippage / fees / real fills haven't eaten it). evaluate_paper_run.
paper_eval:
  min_obs: 60                # min paper return-obs (else a lucky Sharpe) before judging
  min_paper_sharpe: 0.5      # absolute floor on the live paper Sharpe (the edge must persist)
  min_sharpe_retention: 0.5  # paper/backtest Sharpe ratio floor (keep >= half the backtest edge)
