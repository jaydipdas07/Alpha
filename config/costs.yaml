# config/costs.yaml — fees, taxes, slippage. Source: ADR 0008 / §3.
# Illustrative rates — VERIFY against current statute at go-live (config edit only).
slippage:
  equity:       { type: bps,   value: 5 }      # large-cap 5 bps/side
  crypto_perp:  { type: bps,   value: 3 }      # top-liquidity USDT/USD perps at small size
  crypto_spot:  { type: bps,   value: 8 }      # spot majors 5-10 bps/side
  index_option: { type: ticks, value: 2 }      # ATM ~1-2 ticks; scale for far strikes
  default_spread:                               # used only when LTP-only (no quote)
    equity: 0.0005
    crypto_perp: 0.0003
    crypto_spot: 0.0008
    index_option_ticks: 1
  stress_multiplier: 2                          # mandatory 2x backtest stress test

segments:
  equity_intraday:
    brokerage:    { pct: 0.0003, flat: 20, mode: min }   # min(0.03%, ₹20)/order
    stt:          { pct: 0.00025, side: sell }
    exchange_txn: { pct: 0.0000297 }
    sebi:         { pct: 0.000001 }
    gst:          { pct: 0.18, on: [brokerage, exchange_txn, sebi] }
    stamp_duty:   { pct: 0.00003, side: buy }
  index_option:
    brokerage:    { flat: 20, mode: flat }               # ₹20/order
    stt:          { pct: 0.000625, side: sell, on: premium }
    exchange_txn: { pct: 0.0003503, on: premium }
    sebi:         { pct: 0.000001 }
    gst:          { pct: 0.18, on: [brokerage, exchange_txn, sebi] }
    stamp_duty:   { pct: 0.00003, side: buy, on: premium }
  # Perp vs spot are DIFFERENT cost regimes (the old single `crypto` segment charged the
  # 10 bps SPOT taker fee + spot TDS on perp trades — ~2.5x real perp costs). Live crypto
  # today is Delta/Binance perps -> the cost model maps AssetClass.CRYPTO to crypto_perp.
  # `maker_fee` = the post-only resting-order rate (VIP0) for the "maker" execution scenario
  # of the low-churn basis research (basis_cost_fraction); the engine cost model reads only
  # its component allowlist and ignores this key (live maker execution is a Phase-4+ ability).
  crypto_perp:
    trading_fee:  { pct: 0.0005, side: both }            # perp taker ~5 bps
    maker_fee:    { pct: 0.0002, side: both }            # perp post-only ~2 bps (VIP0)
  crypto_spot:
    trading_fee:  { pct: 0.001, side: both }             # spot taker; venue-specific
    maker_fee:    { pct: 0.001, side: both }             # spot maker = taker at VIP0 (no rebate)
    tds:          { pct: 0.01, side: sell }              # 1% TDS on VDA transfer (spot only)

# Perp funding (R13) — the periodic funding payment on a held perpetual position.
# A constant assumed rate for now; real per-interval rates come from the funding-rate
# data feed later. Longs pay shorts when rate > 0; a funding-bleed feeds the loss gate.
funding:
  crypto:
    interval_hours: 8                                     # Binance USDⓈ-M perps fund every 8h
    rate: "0.0001"                                        # 0.01% per interval (assumed)
