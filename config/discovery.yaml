# config/discovery.yaml — the discovery universe (B1b.3d).
#
# Maps each research *cell* (market, window) to the cold-store series the discovery
# loop backtests it on: a (symbol, venue, interval_seconds) the `ColdStoreBarsFor`
# adapter resolves and reads back as in-sample bars.
#
# IN-SAMPLE ONLY (TEST-3 / R6): the adapter reads the no-ACL research cold store,
# which `seal_dataset` has already stripped of the rolled-forward holdout (the holdout
# bars live in the separate, gate-only HoldoutStore). Isolation is *structural* — the
# adapter is a pass-through; it never sees the holdout because the cold store doesn't
# hold it. So these entries name a series, never a holdout boundary.
#
# `window` is the cell's label (also the proposal-ledger cell key, <= 64 chars, no "|").
# `venue`/`market` must be valid Venue/AssetClass enum values. `starting_cash` is the
# backtest capital at the cell's market scale (crypto $ vs equity ₹; the per-cell risk
# base_capital is aligned to it). `templates` (omitted = all registered templates)
# scopes which vetted strategy families the nightly run searches in this cell. The
# series are loaded by scripts/ingest_cold_store.py (BTC-perp 5m ~1mo + daily ~3y; four
# NIFTY constituents daily ~3y); add a row per series as data lands.

# proposals per (cell, template) discovery cycle each run (B1b.4).
n_candidates: 8

cells:
  # --- crypto (Binance USDT perps — wider universe, M3.0) ---
