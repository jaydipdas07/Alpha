# --- cross-sectional panels (M3.0) -------------------------------------------------
# A panel names a whole universe of symbols sharing a (market, venue, interval), to be
# backtested TOGETHER so a strategy can rank the cross-section (relative strength —
# long the top, short the bottom). This is the seam the single-instrument templates
# above structurally cannot see, and it exploits the SAME free Binance data we already
# ingest. The panel backtester + the cross-sectional templates consume these (the next
# increment); ingest (scripts/ingest_cold_store.py) already pulls every member series.
#
# Universe = the 42 most-liquid Binance USDT perpetuals (by 24h quote-volume). Membership
# is POINT-IN-TIME (the M3.0-follow-on unbalanced panel): the backtester's timeline is the
# union of every member's bar-starts, and a symbol enters the cross-section only once it
# has printed a full trailing lookback window — so daily history reaches the oldest
# listings (2019-09, ingest_cold_store `_1D_START`) and a later listing simply joins
# later; the cross-section is thinner early, never look-ahead-biased. Gold / stablecoin
# pegs are excluded (not crypto-momentum names). Widening the universe is a config-only
# edit (add symbols; ingest picks them up).
