# --- delta-neutral basis cells (M3.0 basis track) -----------------------------------
# A basis cell joins a perp panel to its spot twin BY SYMBOL: short one unit of perp, long one
# unit of spot per selected name — the price legs cancel, and the book harvests the funding a
# short perp receives (crypto's structural carry), net of the basis wiggle and BOTH legs'
# costs. `name` is the ledger cell key the basis templates sweep under (distinct from any
# panel name — both live in the same (market, window) key space).
basis_panels:
  - name: "crypto-basis-1d"
    market: CRYPTO
    perp_panel: "crypto-perps-1d"
    spot_panel: "crypto-spot-1d"
