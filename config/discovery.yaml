  # The basis SPOT leg (M3.0 basis track): the perp universe's spot twins on Binance's spot
  # market (venue BINANCE_SPOT — a different book + cost regime, keyed apart in the store).
  # 1000PEPEUSDT / 1000SHIBUSDT are EXCLUDED: their spot tickers differ by a 1000x contract
