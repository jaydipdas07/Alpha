# Paper environment (CLAUDE.md: config/<env>.yaml — infra + the live gate).
#
# THE LIVE GATE: allow_live MUST be false here. Going live (Phase 4+) is a separate
# config/live.yaml that the HUMAN creates + flips — CC never sets allow_live=true,
# never selects a non-testnet venue, never touches live keys (CLAUDE.md never-do).

env: paper
mode: paper
allow_live: false          # the live gate — never true in paper

worker_id: alpha-paper-1
venue: delta-testnet        # Alpha's real crypto venue (perps); keyed + 3.GATE-proven 2026-06-28
strategy: idle              # no-trade soak by default; swap to a real edge per deployment
symbols:
  - BTC/USD:USD             # Delta India BTC perp (0.001 BTC/contract)
bar_interval_seconds: 60    # build 1-minute bars from the tick stream
state_db: sqlite:///var/alpha-worker.db  # durable orders/fills/positions/audit
heartbeat_path: var/run/alpha-worker.heartbeat  # the deadman reads this (TEST-5)
command_poll_seconds: 1.0   # pod commands watchChanges + ~1s fallback (R10)
reconcile_interval_seconds: 30  # periodic broker-truth reconcile + in-band feed-stale check

# Best-effort worker -> pod telemetry (the cockpit sees the worker live/armed). The pod
# is mission control; Lemma is NEVER on the money path (TEST-8), so a pod outage cannot
# affect trading or safety. The TOKEN is NOT here — it is staged in the gitignored .env as
# LEMMA_TOKEN (self-fetched via `lemma auth print-token`); no token => pod-sync is off.
pod_sync:
  enabled: true
  pod_id: "019ef606-7b77-76f1-853a-978ddf819415"  # Vault (mission control)
  base_url: https://api.lemma.work
  heartbeat_seconds: 15
  # Token rotation: re-read LEMMA_TOKEN from .env this often + swap the pod client (no restart),
  # so the ~60-min token stays fresh. A Mac launchd relay (deploy/relay/) keeps .env current.
  token_refresh_seconds: 60
