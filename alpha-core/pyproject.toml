[project]
name = "alpha-core"
version = "0.0.0"
description = "Alpha core — portable strategy contract + risk/cost/reconcile/rigor kernel."
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Jaydip Das" }]
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "structlog>=26.1.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.51",
    "prometheus-client>=0.25.0",
]

[project.optional-dependencies]
# Crypto execution needs ccxt — but the worker / bake-off scripts construct the real
# ccxt exchange; the CcxtAdapter itself imports no SDK (it takes an injected exchange).
# Installed on demand (`uv sync --extra crypto`), not pulled into CI or the kernel.
crypto = ["ccxt>=4.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alpha_core"]
