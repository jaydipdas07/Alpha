[project]
name = "alpha-core"
version = "0.0.0"
description = "Alpha core — portable strategy contract + risk/cost/reconcile/rigor kernel."
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Jaydip Das" }]
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "structlog>=26.1.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.51",
    "prometheus-client>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alpha_core"]
